<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f9fafb" />
  <title>同声 - 面对面翻译</title>
  <style>
    /* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
       Put this @layer first; product CSS outside the layer always wins. */
    @layer od-layout {
      :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
      .od-stack { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
      .od-row { display: flex; align-items: center; gap: var(--od-gap, 8px); }
      .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
      .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
      .od-fill { flex: 1 1 0; min-width: 0; }
      .od-fixed { flex: none; }
      .od-grid { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
      .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
      :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
      .od-tile { display: grid; grid-template-rows: auto 1fr; }
      :where(.od-tile) > :where(*) { display: block; }
      .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
      .od-media-cover { object-fit: cover; }
      .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .od-clamp-2 { -webkit-line-clamp: 2; }
      .od-clamp-3 { -webkit-line-clamp: 3; }
      .od-lines-2 { min-height: calc(2 * 1.4em); }
      .od-nowrap { white-space: nowrap; }
      .od-keep { word-break: keep-all; overflow-wrap: anywhere; }
      .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
      .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
      .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
      .od-rail::-webkit-scrollbar { display: none; }
      :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
      :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
      .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
      .od-touch { min-width: 44px; min-height: 44px; }
    }
    /* /OD-LAYOUT-PRIMITIVES v1 */

    :root {
      --phone-screen-width: 393px;
      --phone-screen-height: 852px;
      --phone-bezel: 12px;
      --phone-outer-radius: 60px;
      --phone-screen-radius: 48px;
      --phone-safe-top: 59px;
      --phone-safe-bottom: 34px;
      --phone-system-fg: #111214;
      --phone-screen-bg: #f9fafb;
      --phone-stage-bg: #e9ebee;
      --bg: #f9fafb;
      --surface: #ffffff;
      --surface-soft: #f1f3f8;
      --ink: #171a25;
      --muted: #5f6678;
      --border: #dfe3ec;
      --primary: #5b5fd6;
      --primary-strong: #4448b8;
      --primary-soft: #ececff;
      --success: #087f5b;
      --success-soft: #e5f7f0;
      --warning: #a95b00;
      --warning-soft: #fff3df;
      --danger: #c93434;
      --danger-soft: #fff0f0;
      --shadow: 0 10px 24px rgba(42, 45, 80, .12);
      --radius-card: 12px;
      --radius-control: 16px;
      --caption-size: 17px;
      --motion-fast: 180ms;
      --motion-standard: 260ms;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--phone-stage-bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    button, select { font: inherit; }
    button { color: inherit; }
    button, select { -webkit-tap-highlight-color: transparent; }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel);
      border-radius: var(--phone-outer-radius);
      background: linear-gradient(160deg, #3a3a3d 0%, #1d1d20 47%, #09090b 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.13), inset 0 0 0 2px rgba(0,0,0,.9), 0 34px 70px -20px rgba(0,0,0,.55), 0 12px 28px -12px rgba(0,0,0,.36);
      isolation: isolate;
    }
    .phone-frame::before, .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 102px;
      bottom: 102px;
      width: 3px;
      border-radius: 3px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.13) 12%, transparent 22%, transparent 78%, rgba(255,255,255,.08) 90%, transparent);
    }
    .phone-frame::before { left: -1px; }
    .phone-frame::after { right: -1px; }
    .hardware-button {
      position: absolute;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #050506, #242428 58%, #08080a);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }
    .hardware-button.silent { left: -3px; top: 175px; height: 34px; }
    .hardware-button.volume-up { left: -3px; top: 225px; height: 62px; }
    .hardware-button.volume-down { left: -3px; top: 299px; height: 62px; }
    .hardware-button.power { right: -3px; top: 252px; height: 104px; }
    .phone-screen {
      position: relative;
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      overflow: hidden;
      border-radius: var(--phone-screen-radius);
      background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .phone-content {
      position: absolute;
      inset: 0;
      overflow: hidden;
      padding-top: var(--phone-safe-top);
      padding-bottom: var(--phone-safe-bottom);
      background: var(--bg);
    }
    .dynamic-island {
      position: absolute;
      z-index: 20;
      top: 11px;
      left: 50%;
      width: 126px;
      height: 37px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #000;
      box-shadow: inset 0 -1px 1px rgba(255,255,255,.05);
      pointer-events: none;
    }
    .status-bar {
      position: absolute;
      z-index: 15;
      top: 0;
      left: 0;
      right: 0;
      height: var(--phone-safe-top);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 18px 27px 0;
      color: var(--phone-system-fg);
      font-size: 15px;
      font-weight: 650;
      pointer-events: none;
    }
    .status-icons { display: inline-flex; align-items: center; gap: 6px; }
    .status-icons svg { display: block; width: 17px; height: 11px; fill: currentColor; }
    .status-icons .battery { width: 25px; }
    .home-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 134px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--phone-system-fg);
      opacity: .9;
      pointer-events: none;
    }

    .language-entry {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 24px;
      height: 100%;
      padding: 24px 20px 20px;
      background: var(--bg);
    }
    .language-entry[hidden], .face-app[hidden] { display: none; }
    .entry-header { display: grid; gap: 16px; }
    .entry-brand { display: flex; align-items: center; gap: 10px; }
    .entry-brand .brand-mark { width: 36px; height: 36px; border-radius: 11px; }
    .entry-brand strong { font-size: 17px; }
    .entry-heading { display: grid; gap: 8px; }
    .entry-heading h1 { margin: 0; font-size: 28px; line-height: 1.2; }
    .entry-heading p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .language-setup {
      display: grid;
      align-content: center;
      gap: 12px;
      min-height: 0;
    }
    .language-choice {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      background: var(--surface);
      box-shadow: 0 4px 16px rgba(42, 45, 80, .05);
    }
    .choice-avatar {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 17px;
      font-weight: 760;
    }
    .choice-avatar.party-b-avatar { color: var(--success); background: var(--success-soft); }
    .choice-content { display: grid; gap: 6px; min-width: 0; }
    .choice-content label { display: block; color: var(--muted); font-size: 13px; font-weight: 650; }
    .entry-select {
      width: 100%;
      min-height: 44px;
      padding: 0 36px 0 0;
      border: 0;
      color: var(--ink);
      background: transparent;
      font-size: 17px;
      font-weight: 720;
      cursor: pointer;
    }
    .entry-swap-row { display: flex; align-items: center; gap: 12px; }
    .entry-swap-row::before, .entry-swap-row::after { content: ""; height: 1px; flex: 1 1 0; background: var(--border); }
    .entry-swap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 112px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--primary);
      background: var(--surface);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .entry-swap svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .entry-footer { display: grid; gap: 10px; }
    .entry-error { min-height: 22px; margin: 0; color: var(--danger); font-size: 14px; line-height: 1.5; text-align: center; }
    .start-button {
      min-height: 54px;
      padding: 0 20px;
      border: 0;
      border-radius: var(--radius-control);
      color: #fff;
      background: var(--primary);
      box-shadow: 0 9px 20px rgba(91, 95, 214, .26);
      font-size: 17px;
      font-weight: 740;
      cursor: pointer;
      transition: transform var(--motion-fast) ease-out, opacity var(--motion-fast) ease-out;
    }
    .start-button:active { transform: scale(.98); }
    .start-button:disabled { cursor: not-allowed; opacity: .42; box-shadow: none; }
    .entry-note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; text-align: center; }
    .route-enter-forward { animation: route-forward var(--motion-standard) ease-out both; }
    .route-enter-back { animation: route-back var(--motion-standard) ease-out both; }

    .face-app {
      display: grid;
      grid-template-rows: minmax(0, 1fr) 88px minmax(0, 1fr);
      height: 100%;
      background: var(--bg);
    }
    .party-pane {
      min-height: 0;
      padding: 10px 16px;
      background: var(--surface);
    }
    .party-pane.party-a { border-bottom: 1px solid var(--border); }
    .party-pane.party-b { border-top: 1px solid var(--border); }
    .party-inner {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 8px;
      height: 100%;
      min-height: 0;
    }
    .party-a .party-inner { transform: rotate(180deg); }
    .party-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 40px;
    }
    .party-name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 15px;
      font-weight: 720;
    }
    .party-dot { display: block; width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--primary); }
    .party-b .party-dot { background: var(--success); }
    .language-select {
      min-width: 112px;
      height: 40px;
      padding: 0 30px 0 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--ink);
      background: var(--surface-soft);
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }
    .subtitle-feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      padding: 2px 1px;
    }
    .subtitle-feed::-webkit-scrollbar { display: none; }
    .empty-state {
      display: grid;
      place-items: center;
      min-height: 100%;
      padding: 12px;
      color: var(--muted);
      text-align: center;
    }
    .empty-state .od-field { --od-gap: 4px; }
    .empty-state strong { font-size: 15px; color: var(--ink); }
    .empty-state span { font-size: 13px; line-height: 1.45; }
    .message-card {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      color: var(--ink);
      background: var(--surface-soft);
      text-align: left;
      animation: message-in var(--motion-standard) ease-out both;
    }
    .message-card .source {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .message-card .translation {
      display: block;
      margin-top: 4px;
      font-size: var(--caption-size);
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .message-card .message-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }
    .message-card svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .message-direction { display: inline-flex; align-items: center; gap: 4px; }
    .talk-control {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      min-height: 84px;
    }
    .mic-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 84px;
      height: 84px;
    }
    .mic-wave {
      position: absolute;
      display: block;
      width: 72px;
      height: 72px;
      border: 2px solid var(--danger);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }
    .mic-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: var(--primary);
      box-shadow: 0 8px 18px rgba(91, 95, 214, .28);
      cursor: pointer;
      touch-action: none;
      user-select: none;
      transition: transform var(--motion-fast) ease-out, background-color var(--motion-fast) ease-out, opacity var(--motion-fast) ease-out;
    }
    .party-b .mic-button { background: var(--success); box-shadow: 0 8px 18px rgba(8, 127, 91, .22); }
    .mic-button svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .mic-button > svg { transition: opacity var(--motion-fast) ease-out, transform var(--motion-fast) ease-out; }
    .volume-waveform {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 38px;
      height: 30px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-fast) ease-out;
    }
    .volume-bar {
      display: block;
      width: 3px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      transition: height 100ms ease-out;
    }
    .mic-button.is-recording { transform: scale(1.05); background: var(--danger); }
    .mic-button.is-recording > svg { opacity: 0; transform: scale(.72); }
    .mic-button.is-recording .volume-waveform { opacity: 1; }
    .mic-button.is-recording.is-canceling { transform: scale(.96); background: var(--warning); }
    .mic-button.is-conflicted { background: var(--warning); animation: mic-conflict var(--motion-fast) ease-out 2; }
    .mic-button.is-recording + .mic-wave, .mic-wrap.is-recording .mic-wave { animation: record-wave 1.15s ease-out infinite; }
    .mic-wrap.is-canceling .mic-wave { border-color: var(--warning); animation: none; opacity: .48; }
    .mic-button:disabled { cursor: wait; opacity: .42; box-shadow: none; }
    .talk-copy { --od-gap: 3px; }
    .talk-copy strong { font-size: 16px; }
    .talk-copy span { color: var(--muted); font-size: 13px; line-height: 1.4; }

    .center-console {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 64px;
      padding: 4px 8px;
      border-block: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
      background: var(--surface-soft);
      transition: background-color 240ms ease-out, box-shadow 240ms ease-out;
    }
    .status-copy {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 680;
      line-height: 1.25;
      text-align: center;
      white-space: normal;
    }
    .status-copy.top { transform: rotate(180deg); }
    .status-copy .statusText { display: block; min-width: 0; }
    .status-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 14px;
      height: 12px;
      flex: none;
    }
    .status-mark > span {
      display: none;
      width: 3px;
      height: 3px;
      border-radius: 999px;
      background: currentColor;
    }
    .status-mark > span:nth-child(2) { display: block; width: 7px; height: 7px; }
    .center-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      justify-self: center;
      gap: 8px;
      padding: 4px;
      border: 1px solid color-mix(in srgb, var(--border) 82%, transparent);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 4px 12px rgba(27, 31, 52, .08);
    }
    .icon-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      box-shadow: none;
      transition: transform var(--motion-fast) ease-out, color var(--motion-fast) ease-out, background-color var(--motion-fast) ease-out, opacity var(--motion-fast) ease-out;
    }
    .icon-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-button:active:not(:disabled) { transform: scale(.92); }
    .icon-button:disabled { cursor: wait; opacity: .38; }
    .center-language-button {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 2px 6px color-mix(in srgb, var(--primary) 24%, transparent);
    }
    .center-language-button svg { width: 20px; height: 20px; stroke-width: 2; }
    .center-danger-button {
      color: var(--danger);
      background: transparent;
    }

    .face-app[data-status="recording"] .status-copy { color: var(--danger); }
    .face-app[data-status="recognizing"] .status-copy,
    .face-app[data-status="translating"] .status-copy { color: var(--primary); }
    .face-app[data-status="playing"] .status-copy { color: var(--success); }
    .face-app[data-status="playing"] .center-console {
      background: color-mix(in srgb, var(--success-soft) 78%, var(--surface-soft));
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--success) 18%, transparent), inset 0 -1px 0 color-mix(in srgb, var(--success) 18%, transparent);
    }
    .face-app[data-status="warning"] .status-copy { color: var(--warning); }
    .face-app[data-status="error"] .status-copy { color: var(--danger); }
    .face-app[data-status="recognizing"] .status-mark,
    .face-app[data-status="translating"] .status-mark { animation: status-pulse .8s ease-in-out infinite alternate; }
    .face-app[data-status="playing"] .status-mark > span {
      display: block;
      width: 3px;
      border-radius: 999px;
      animation: audio-bar .72s ease-in-out infinite alternate;
    }
    .face-app[data-status="playing"] .status-mark > span:nth-child(1) { height: 5px; animation-delay: -240ms; }
    .face-app[data-status="playing"] .status-mark > span:nth-child(2) { height: 10px; animation-delay: -480ms; }
    .face-app[data-status="playing"] .status-mark > span:nth-child(3) { height: 7px; animation-delay: -120ms; }

    .overlay {
      position: absolute;
      z-index: 30;
      top: var(--phone-safe-top);
      right: 0;
      bottom: var(--phone-safe-bottom);
      left: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(20, 22, 32, .46);
      transition: opacity var(--motion-fast) ease-out;
    }
    .overlay[hidden] { display: none; }
    .dialog {
      width: min(100%, 326px);
      padding: 24px;
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .dialog-icon { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: 16px; border-radius: 14px; color: var(--primary); background: var(--primary-soft); }
    .dialog-icon svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .dialog h2 { margin: 0; font-size: 21px; line-height: 1.3; }
    .dialog p { margin: 8px 0 20px; color: var(--muted); font-size: 15px; line-height: 1.6; }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-button {
      min-height: 48px;
      padding: 0 14px;
      border: 0;
      border-radius: var(--radius-control);
      font-weight: 700;
      cursor: pointer;
    }
    .action-button.secondary { color: var(--ink); background: var(--surface-soft); }
    .action-button.primary { color: #fff; background: var(--primary); box-shadow: 0 7px 16px rgba(91,95,214,.24); }
    .toast {
      position: absolute;
      z-index: 35;
      right: 20px;
      bottom: calc(var(--phone-safe-bottom) + 12px);
      left: 20px;
      display: block;
      padding: 11px 14px;
      border-radius: 12px;
      color: #fff;
      background: #252938;
      box-shadow: var(--shadow);
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      animation: toast-in var(--motion-fast) ease-out both;
    }
    .toast[hidden] { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    :focus-visible { outline: 3px solid #2f73c8; outline-offset: 3px; }
    @media (hover: hover) {
      .mic-button:hover { filter: brightness(.94); }
      .icon-button:hover:not(:disabled) { color: var(--primary); background: var(--primary-soft); }
      .center-language-button:hover:not(:disabled) { color: #fff; background: var(--primary-strong); }
      .center-danger-button:hover:not(:disabled) { color: var(--danger); background: var(--danger-soft); }
      .action-button:hover { filter: brightness(.96); }
      .entry-swap:hover { border-color: #c7c9f6; background: var(--primary-soft); }
      .start-button:hover:not(:disabled) { background: var(--primary-strong); }
    }
    @keyframes record-wave { 0% { transform: scale(.88); opacity: .7; } 100% { transform: scale(1.18); opacity: 0; } }
    @keyframes mic-conflict { 0%, 100% { transform: translateX(0); } 35% { transform: translateX(-4px); } 65% { transform: translateX(4px); } }
    @keyframes status-pulse { from { opacity: .35; transform: scale(.8); } to { opacity: 1; transform: scale(1.18); } }
    @keyframes audio-bar { from { transform: scaleY(.45); opacity: .56; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes message-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes route-forward { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes route-back { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: translateX(0); } }

    @media (prefers-color-scheme: dark) {
      :root {
        --phone-system-fg: #f4f5f8;
        --phone-screen-bg: #1f2937;
        --bg: #1f2937;
        --surface: #273345;
        --surface-soft: #303d50;
        --ink: #f5f7fb;
        --muted: #c1c8d4;
        --border: #465367;
        --primary: #8588f3;
        --primary-strong: #a2a4ff;
        --primary-soft: #383b68;
        --success: #58d8ad;
        --success-soft: #254b43;
        --warning: #ffc067;
        --warning-soft: #584220;
        --danger: #ff8585;
        --danger-soft: #5a3035;
        color-scheme: dark;
      }
      .toast { background: #f4f5f8; color: #171a25; }
    }
    @media (max-height: 939px) and (min-width: 481px) { .phone-frame { zoom: .9; } }
    @media (max-height: 851px) and (min-width: 481px) { .phone-frame { zoom: .82; } }
    @media (max-height: 781px) and (min-width: 481px) { .phone-frame { zoom: .74; } }
    @media (max-height: 711px) and (min-width: 481px) { .phone-frame { zoom: .66; } }
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .face-app[data-status="playing"] .status-mark > span { animation: none !important; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="phone-frame" data-phone-shell data-platform="iphone">
    <span class="hardware-button silent" aria-hidden="true"></span>
    <span class="hardware-button volume-up" aria-hidden="true"></span>
    <span class="hardware-button volume-down" aria-hidden="true"></span>
    <span class="hardware-button power" aria-hidden="true"></span>

    <section class="phone-screen" data-phone-screen>
      <main class="phone-content" data-phone-content>
        <!-- APP CONTENT START -->
        <section class="language-entry" id="languageEntry" aria-labelledby="entryTitle">
          <header class="entry-header">
            <div class="entry-brand">
              <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 8h9m-4-4 4 4-4 4M19 16h-9m4-4-4 4 4 4"/></svg></span>
              <strong>同声</strong>
            </div>
            <div class="entry-heading">
              <h1 id="entryTitle">先选双方语言</h1>
              <p>将手机放在两人之间，选择各自使用的语言后开始面对面对话。</p>
            </div>
          </header>

          <div class="language-setup">
            <div class="language-choice">
              <span class="choice-avatar" aria-hidden="true">A</span>
              <div class="choice-content">
                <label for="entryLanguageA">对面用户的语言</label>
                <select class="entry-select" id="entryLanguageA">
                  <option value="zh-CN">中文</option>
                  <option value="en-US">English</option>
                  <option value="ja-JP">日本語</option>
                  <option value="ko-KR">한국어</option>
                  <option value="fr-FR">Français</option>
                  <option value="es-ES">Español</option>
                </select>
              </div>
            </div>
            <div class="entry-swap-row">
              <button class="entry-swap" id="entrySwapButton" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3m3 3-3 3M17 17H5l3 3m-3-3 3-3"/></svg>
                <span>交换语言</span>
              </button>
            </div>
            <div class="language-choice">
              <span class="choice-avatar party-b-avatar" aria-hidden="true">B</span>
              <div class="choice-content">
                <label for="entryLanguageB">这边用户的语言</label>
                <select class="entry-select" id="entryLanguageB">
                  <option value="en-US">English</option>
                  <option value="zh-CN">中文</option>
                  <option value="ja-JP">日本語</option>
                  <option value="ko-KR">한국어</option>
                  <option value="fr-FR">Français</option>
                  <option value="es-ES">Español</option>
                </select>
              </div>
            </div>
          </div>

          <footer class="entry-footer">
            <p class="entry-error" id="entryError" role="status"></p>
            <button class="start-button" id="startConversation" type="button">开始对话</button>
            <p class="entry-note">语言可在对话中随时返回修改</p>
          </footer>
        </section>

        <div class="face-app" id="faceApp" data-status="waiting" hidden>
          <section class="party-pane party-a" aria-label="对面用户的操作区域">
            <div class="party-inner">
              <header class="party-head">
                <div class="party-name"><span class="party-dot" aria-hidden="true"></span><span id="partyNameA">对面 · A</span></div>
                <label class="sr-only" for="languageA">A用户语言</label>
                <select class="language-select" id="languageA" aria-label="A用户语言">
                  <option value="zh-CN">中文</option>
                  <option value="en-US">English</option>
                  <option value="ja-JP">日本語</option>
                  <option value="ko-KR">한국어</option>
                  <option value="fr-FR">Français</option>
                  <option value="es-ES">Español</option>
                </select>
              </header>
              <div class="subtitle-feed" id="feedA" aria-live="polite" aria-label="A用户收到的翻译字幕">
                <div class="empty-state" id="emptyA"><div class="od-field"><strong id="emptyTitleA">这里显示对方的译文</strong><span id="emptyHintA">请按住麦克风开始说话</span></div></div>
              </div>
              <div class="talk-control">
                <div class="mic-wrap" id="micWrapA">
                  <button class="mic-button" id="micA" type="button" data-side="a" aria-label="A用户按住说话">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0m7 7v3m-4 0h8"/></svg>
                    <span class="volume-waveform" aria-hidden="true"><span class="volume-bar"></span><span class="volume-bar"></span><span class="volume-bar"></span><span class="volume-bar"></span><span class="volume-bar"></span></span>
                  </button>
                  <span class="mic-wave" aria-hidden="true"></span>
                </div>
                <div class="talk-copy od-field"><strong id="talkTitleA">按住说话</strong><span id="talkHintA">A说完后，译文显示给B</span></div>
              </div>
            </div>
          </section>

          <section class="center-console" aria-label="共享对话状态">
            <div class="status-copy top"><span class="status-mark" aria-hidden="true"><span></span><span></span><span></span></span><span class="statusText">等待说话</span></div>
            <div class="center-actions">
              <button class="icon-button" id="swapButton" type="button" aria-label="交换双方语言" title="交换语言">
                <svg viewBox="0 0 24 24"><path d="M7 7h12l-3-3m3 3-3 3M17 17H5l3 3m-3-3 3-3"/></svg>
              </button>
              <button class="icon-button center-language-button" id="changeLanguagesButton" type="button" aria-label="返回修改双方语言" title="修改语言">
                <svg viewBox="0 0 24 24"><path d="M4 5h10M9 3v2m-3 0c.5 3 2.2 5.5 5 7m1-7c-.6 3.8-3.1 7-7 9m9-2 4 9m2-9-4 9m-1.2-3h4.4"/></svg>
              </button>
              <button class="icon-button center-danger-button" id="clearButton" type="button" aria-label="清空双方字幕" title="清空字幕">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
              </button>
            </div>
            <div class="status-copy"><span class="status-mark" aria-hidden="true"><span></span><span></span><span></span></span><span class="statusText">等待说话</span></div>
          </section>

          <section class="party-pane party-b" aria-label="近侧用户的操作区域">
            <div class="party-inner">
              <header class="party-head">
                <div class="party-name"><span class="party-dot" aria-hidden="true"></span><span id="partyNameB">这边 · B</span></div>
                <label class="sr-only" for="languageB">B用户语言</label>
                <select class="language-select" id="languageB" aria-label="B用户语言">
                  <option value="en-US">English</option>
                  <option value="zh-CN">中文</option>
                  <option value="ja-JP">日本語</option>
                  <option value="ko-KR">한국어</option>
                  <option value="fr-FR">Français</option>
                  <option value="es-ES">Español</option>
                </select>
              </header>
              <div class="subtitle-feed" id="feedB" aria-live="polite" aria-label="B用户收到的翻译字幕">
                <div class="empty-state" id="emptyB"><div class="od-field"><strong id="emptyTitleB">这里显示对方的译文</strong><span id="emptyHintB">请按住麦克风开始说话</span></div></div>
              </div>
              <div class="talk-control">
                <div class="mic-wrap" id="micWrapB">
                  <button class="mic-button" id="micB" type="button" data-side="b" aria-label="B用户按住说话">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0m7 7v3m-4 0h8"/></svg>
                    <span class="volume-waveform" aria-hidden="true"><span class="volume-bar"></span><span class="volume-bar"></span><span class="volume-bar"></span><span class="volume-bar"></span><span class="volume-bar"></span></span>
                  </button>
                  <span class="mic-wave" aria-hidden="true"></span>
                </div>
                <div class="talk-copy od-field"><strong id="talkTitleB">按住说话</strong><span id="talkHintB">B说完后，译文显示给A</span></div>
              </div>
            </div>
          </section>
          <div class="sr-only" id="liveRegion" aria-live="assertive"></div>
        </div>
        <!-- APP CONTENT END -->
      </main>

      <div class="overlay" id="permissionOverlay" role="dialog" aria-modal="true" aria-labelledby="permissionTitle" hidden>
        <div class="dialog">
          <div class="dialog-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0m7 7v3m-4 0h8"/></svg></div>
          <h2 id="permissionTitle">允许使用麦克风</h2>
          <p id="permissionCopy">同声需要麦克风来接收双方的语音。本原型只模拟授权，不会上传录音。</p>
          <div class="dialog-actions">
            <button class="action-button secondary" id="denyPermission" type="button">暂不允许</button>
            <button class="action-button primary" id="allowPermission" type="button">允许</button>
          </div>
        </div>
      </div>
      <div class="toast" id="toast" role="status" hidden></div>

      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <span class="status-icons">
          <svg viewBox="0 0 18 12"><path d="M1 10.5h2V8H1v2.5Zm4 0h2V5.5H5v5Zm4 0h2V3H9v7.5Zm4 0h2V.5h-2v10Z"/></svg>
          <svg viewBox="0 0 18 12"><path d="M9 11.2 7.2 9.4a2.55 2.55 0 0 1 3.6 0L9 11.2Zm4.1-4.1-1.35 1.35a3.9 3.9 0 0 0-5.5 0L4.9 7.1a5.8 5.8 0 0 1 8.2 0Zm3-3-1.35 1.35a8.15 8.15 0 0 0-11.5 0L1.9 4.1a10.05 10.05 0 0 1 14.2 0Z"/></svg>
          <svg class="battery" viewBox="0 0 27 12"><path fill-rule="evenodd" d="M2.5 1h19A2.5 2.5 0 0 1 24 3.5v5a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 0 8.5v-5A2.5 2.5 0 0 1 2.5 1Zm0 1A1.5 1.5 0 0 0 1 3.5v5A1.5 1.5 0 0 0 2.5 10h19A1.5 1.5 0 0 0 23 8.5v-5A1.5 1.5 0 0 0 21.5 2h-19Zm.5 1h17.5A1.5 1.5 0 0 1 22 4.5v3A1.5 1.5 0 0 1 20.5 9H3V3Zm22 1.5a1.5 1.5 0 0 1 0 3v-3Z"/></svg>
        </span>
      </div>
      <div class="dynamic-island" aria-hidden="true"></div>
      <div class="home-indicator" aria-hidden="true"></div>
    </section>
  </div>

  <script>
    (() => {
      const app = document.getElementById('faceApp');
      const languageEntry = document.getElementById('languageEntry');
      const entryLanguageA = document.getElementById('entryLanguageA');
      const entryLanguageB = document.getElementById('entryLanguageB');
      const entrySwapButton = document.getElementById('entrySwapButton');
      const startConversation = document.getElementById('startConversation');
      const entryError = document.getElementById('entryError');
      const changeLanguagesButton = document.getElementById('changeLanguagesButton');
      const micButtons = [...document.querySelectorAll('.mic-button')];
      const micWraps = { a: document.getElementById('micWrapA'), b: document.getElementById('micWrapB') };
      const volumeBars = {
        a: [...document.querySelectorAll('#micA .volume-bar')],
        b: [...document.querySelectorAll('#micB .volume-bar')]
      };
      const feeds = { a: document.getElementById('feedA'), b: document.getElementById('feedB') };
      const emptyStates = { a: document.getElementById('emptyA'), b: document.getElementById('emptyB') };
      const languageA = document.getElementById('languageA');
      const languageB = document.getElementById('languageB');
      const statusTexts = [...document.querySelectorAll('.statusText')];
      const swapButton = document.getElementById('swapButton');
      const clearButton = document.getElementById('clearButton');
      const permissionOverlay = document.getElementById('permissionOverlay');
      const permissionTitle = document.getElementById('permissionTitle');
      const permissionCopy = document.getElementById('permissionCopy');
      const allowPermission = document.getElementById('allowPermission');
      const denyPermission = document.getElementById('denyPermission');
      const toast = document.getElementById('toast');
      const liveRegion = document.getElementById('liveRegion');

      const languageNames = {
        'zh-CN': '中文', 'en-US': 'English', 'ja-JP': '日本語',
        'ko-KR': '한국어', 'fr-FR': 'Français', 'es-ES': 'Español'
      };
      const englishLanguageNames = {
        'zh-CN': 'Chinese', 'en-US': 'English', 'ja-JP': 'Japanese',
        'ko-KR': 'Korean', 'fr-FR': 'French', 'es-ES': 'Spanish'
      };
      const samples = {
        'zh-CN': { source: '请问，附近的地铁站怎么走？', translationZh: '请问，附近的地铁站怎么走？', translationEn: 'Excuse me, how do I get to the nearest subway station?' },
        'en-US': { source: 'Could you recommend a nearby place for dinner?', translationZh: '你能推荐一家附近适合吃晚餐的地方吗？', translationEn: 'Could you recommend a nearby place for dinner?' },
        'ja-JP': { source: '駅はどこにありますか？', translationZh: '请问车站在哪里？', translationEn: 'Where is the station, please?' },
        'ko-KR': { source: '이 근처에 카페가 있나요?', translationZh: '这附近有咖啡馆吗？', translationEn: 'Is there a cafe nearby?' },
        'fr-FR': { source: 'Où se trouve la gare, s’il vous plaît ?', translationZh: '请问火车站在哪里？', translationEn: 'Where is the train station, please?' },
        'es-ES': { source: '¿Puede ayudarme a encontrar este lugar?', translationZh: '你能帮我找到这个地方吗？', translationEn: 'Could you help me find this place?' }
      };
      const state = {
        permission: 'prompt',
        busy: false,
        recordingSide: null,
        recordingInputType: null,
        activePointerId: null,
        activeKey: null,
        pointerStartY: null,
        cancelArmed: false,
        startedAt: 0,
        timer: null,
        maxTimer: null,
        toastTimer: null,
        playbackTimer: null,
        playbackToken: 0,
        lastMessage: null
      };

      function languageFor(side) { return side === 'a' ? languageA.value : languageB.value; }
      function targetFor(side) { return side === 'a' ? 'b' : 'a'; }
      function isChineseSide(side) { return languageFor(side) === 'zh-CN'; }
      function englishStatus(text) {
        if (text.startsWith('正在录音')) return text.replace('正在录音', 'Recording');
        const translations = {
          '等待说话': 'Ready to talk',
          '正在识别...': 'Recognizing...',
          '正在翻译...': 'Translating...',
          '正在播放翻译语音': 'Playing translation',
          '松开取消录音': 'Release to cancel',
          '说话时间太短，请重试': 'Too short, please try again',
          '录音已取消，请重试': 'Recording canceled, please try again',
          '语音播放失败，请重试': 'Playback failed, please try again',
          '麦克风未授权': 'Microphone access required'
        };
        return translations[text] || text;
      }
      function localizeParty(side) {
        const suffix = side.toUpperCase();
        const chinese = isChineseSide(side);
        const select = side === 'a' ? languageA : languageB;
        const feed = feeds[side];
        const mic = document.querySelector(`.mic-button[data-side="${side}"]`);
        const labels = chinese ? {
          name: side === 'a' ? '对面 · A' : '这边 · B',
          emptyTitle: '这里显示对方的译文',
          emptyHint: '请按住麦克风开始说话',
          talkTitle: '按住说话',
          talkHint: `${suffix}说完后，译文显示给${side === 'a' ? 'B' : 'A'}`,
          language: `${suffix}用户语言`,
          feed: `${suffix}用户收到的翻译字幕`,
          mic: `${suffix}用户按住说话`
        } : {
          name: side === 'a' ? 'Across · A' : 'This side · B',
          emptyTitle: 'Translation appears here',
          emptyHint: 'Press and hold the microphone to speak',
          talkTitle: 'Hold to talk',
          talkHint: `${suffix} speaks, ${side === 'a' ? 'B' : 'A'} receives the translation`,
          language: `${suffix} language`,
          feed: `Translations received by ${suffix}`,
          mic: `${suffix}, press and hold to talk`
        };
        document.getElementById(`partyName${suffix}`).textContent = labels.name;
        document.getElementById(`emptyTitle${suffix}`).textContent = labels.emptyTitle;
        document.getElementById(`emptyHint${suffix}`).textContent = labels.emptyHint;
        document.getElementById(`talkTitle${suffix}`).textContent = labels.talkTitle;
        document.getElementById(`talkHint${suffix}`).textContent = labels.talkHint;
        select.setAttribute('aria-label', labels.language);
        feed.setAttribute('aria-label', labels.feed);
        mic.setAttribute('aria-label', labels.mic);
      }
      function localizeParties() {
        localizeParty('a');
        localizeParty('b');
      }
      function updateEntryState() {
        const sameLanguage = entryLanguageA.value === entryLanguageB.value;
        startConversation.disabled = sameLanguage;
        entryError.textContent = sameLanguage ? '请选择两种不同的语言' : '';
      }
      function showConversation() {
        languageA.value = entryLanguageA.value;
        languageB.value = entryLanguageB.value;
        localizeParties();
        languageEntry.hidden = true;
        app.hidden = false;
        app.classList.remove('route-enter-back');
        app.classList.add('route-enter-forward');
        window.setTimeout(() => app.classList.remove('route-enter-forward'), 280);
        setStatus('waiting', '等待说话');
      }
      function requestConversationStart() {
        if (state.permission === 'granted') {
          showConversation();
          return;
        }
        openPermissionDialog(state.permission === 'denied');
      }
      function showLanguageEntry() {
        if (state.busy || state.recordingSide) {
          showToast('请等待当前语音处理完成');
          return;
        }
        entryLanguageA.value = languageA.value;
        entryLanguageB.value = languageB.value;
        updateEntryState();
        app.hidden = true;
        languageEntry.hidden = false;
        languageEntry.classList.remove('route-enter-forward');
        languageEntry.classList.add('route-enter-back');
        window.setTimeout(() => languageEntry.classList.remove('route-enter-back'), 280);
        entryLanguageA.focus();
      }
      function formatDuration(milliseconds) {
        const totalSeconds = Math.min(60, Math.floor(milliseconds / 1000));
        return `00:${String(totalSeconds).padStart(2, '0')}`;
      }
      function setStatus(type, text) {
        app.dataset.status = type;
        statusTexts[0].textContent = isChineseSide('a') ? text : englishStatus(text);
        statusTexts[1].textContent = isChineseSide('b') ? text : englishStatus(text);
        liveRegion.textContent = text;
      }
      function setMicrophonesDisabled(disabled, allowPlaybackInterrupt = false) {
        micButtons.forEach((button) => { button.disabled = disabled && !allowPlaybackInterrupt; });
        languageA.disabled = disabled;
        languageB.disabled = disabled;
        swapButton.disabled = disabled;
      }
      function showToast(message) {
        window.clearTimeout(state.toastTimer);
        toast.textContent = message;
        toast.hidden = false;
        state.toastTimer = window.setTimeout(() => { toast.hidden = true; }, 2200);
      }
      function openPermissionDialog(denied = false) {
        permissionTitle.textContent = denied ? '需要麦克风权限' : '允许使用麦克风';
        permissionCopy.textContent = denied
          ? '请在系统设置中允许麦克风访问，然后返回此处重试。本原型可点击“重新允许”继续演示。'
          : '同声需要麦克风来接收双方的语音。本原型只模拟授权，不会上传录音。';
        allowPermission.textContent = denied ? '重新允许' : '允许';
        permissionOverlay.hidden = false;
        allowPermission.focus();
      }
      function closePermissionDialog() { permissionOverlay.hidden = true; }
      function updateVolumeWaveform(side) {
        const phase = Date.now() / 140;
        volumeBars[side].forEach((bar, index) => {
          const level = state.cancelArmed
            ? .12 + Math.abs(index - 2) * .05
            : Math.min(1, .22 + Math.abs(Math.sin(phase + index * 1.1)) * .62 + Math.random() * .16);
          bar.style.height = `${Math.round(6 + level * 20)}px`;
        });
      }
      function resetVolumeWaveform(side) {
        const idleHeights = [6, 8, 10, 8, 6];
        volumeBars[side].forEach((bar, index) => { bar.style.height = `${idleHeights[index]}px`; });
      }
      function resetRecordingVisual(side) {
        const button = document.querySelector(`.mic-button[data-side="${side}"]`);
        button?.classList.remove('is-recording', 'is-canceling');
        micWraps[side].classList.remove('is-recording', 'is-canceling');
        resetVolumeWaveform(side);
      }
      function showRecordingConflict(side) {
        const suffix = side.toUpperCase();
        const chinese = isChineseSide(side);
        const button = document.querySelector(`.mic-button[data-side="${side}"]`);
        button.classList.add('is-conflicted');
        button.setAttribute('aria-label', chinese ? '对方正在说话，请稍候' : 'Other side is speaking, please wait');
        document.getElementById(`talkTitle${suffix}`).textContent = chinese ? '对方正在说话' : 'Other side is speaking';
        document.getElementById(`talkHint${suffix}`).textContent = chinese ? '请等待本次录音结束' : 'Wait until this recording ends';
        liveRegion.textContent = chinese ? '对方正在录音，请稍候' : 'The other side is recording, please wait';
      }
      function clearRecordingConflict() {
        micButtons.forEach((button) => button.classList.remove('is-conflicted'));
        localizeParties();
      }
      function beginRecording(event) {
        const button = event.currentTarget;
        const side = button.dataset.side;
        const isPlaying = state.busy && app.dataset.status === 'playing';
        const isPointerInput = typeof event.pointerId === 'number';
        const isKeyboardInput = event.code === 'Space' || event.code === 'Enter';
        if (typeof event.button === 'number' && event.button > 0) return;
        if (state.recordingSide) {
          event.preventDefault();
          if (state.recordingSide !== side) showRecordingConflict(side);
          return;
        }
        if (state.busy && !isPlaying) return;
        event.preventDefault();
        if (state.permission !== 'granted') {
          openPermissionDialog(state.permission === 'denied');
          return;
        }
        if (isPlaying) {
          finishPlayback();
          window.speechSynthesis?.cancel();
        }
        clearRecordingConflict();
        state.recordingSide = side;
        state.recordingInputType = isPointerInput ? 'pointer' : 'keyboard';
        state.activePointerId = isPointerInput ? event.pointerId : null;
        state.activeKey = isKeyboardInput ? event.code : null;
        state.pointerStartY = isPointerInput ? event.clientY : null;
        state.cancelArmed = false;
        state.startedAt = Date.now();
        if (isPointerInput) button.setPointerCapture?.(event.pointerId);
        button.classList.add('is-recording');
        micWraps[side].classList.add('is-recording');
        updateVolumeWaveform(side);
        setStatus('recording', '正在录音 00:00');
        state.timer = window.setInterval(() => {
          updateVolumeWaveform(side);
          if (!state.cancelArmed) setStatus('recording', `正在录音 ${formatDuration(Date.now() - state.startedAt)}`);
        }, 120);
        state.maxTimer = window.setTimeout(() => {
          if (state.cancelArmed) cancelRecording(side, null);
          else finishRecording(side, true);
        }, 60000);
      }
      function inputOwnsRecording(event) {
        if (!event) return true;
        if (state.recordingInputType === 'pointer') return event.pointerId === state.activePointerId;
        if (state.recordingInputType === 'keyboard') return event.code === state.activeKey;
        return false;
      }
      function clearRecordingInput() {
        state.recordingInputType = null;
        state.activePointerId = null;
        state.activeKey = null;
        state.pointerStartY = null;
        state.cancelArmed = false;
      }
      function setSlideCancelState(side, armed) {
        if (state.cancelArmed === armed) return;
        state.cancelArmed = armed;
        const suffix = side.toUpperCase();
        const chinese = isChineseSide(side);
        const button = document.querySelector(`.mic-button[data-side="${side}"]`);
        button.classList.toggle('is-canceling', armed);
        micWraps[side].classList.toggle('is-canceling', armed);
        if (armed) {
          button.setAttribute('aria-label', chinese ? '松开取消录音' : 'Release to cancel recording');
          document.getElementById(`talkTitle${suffix}`).textContent = chinese ? '松开取消' : 'Release to cancel';
          document.getElementById(`talkHint${suffix}`).textContent = chinese ? '向下滑可继续录音' : 'Slide down to keep recording';
          setStatus('canceling', '松开取消录音');
        } else {
          localizeParty(side);
          setStatus('recording', `正在录音 ${formatDuration(Date.now() - state.startedAt)}`);
        }
      }
      function trackSlideCancel(event) {
        const side = event.currentTarget.dataset.side;
        if (state.recordingSide !== side || state.recordingInputType !== 'pointer' || !inputOwnsRecording(event)) return;
        event.preventDefault();
        const distance = side === 'a'
          ? event.clientY - state.pointerStartY
          : state.pointerStartY - event.clientY;
        if (!state.cancelArmed && distance >= 64) setSlideCancelState(side, true);
        else if (state.cancelArmed && distance <= 44) setSlideCancelState(side, false);
      }
      function finishRecording(side, reachedLimit = false, event = null) {
        if (state.recordingSide !== side) return;
        if (!reachedLimit && !inputOwnsRecording(event)) return;
        const elapsed = Date.now() - state.startedAt;
        window.clearInterval(state.timer);
        window.clearTimeout(state.maxTimer);
        state.recordingSide = null;
        clearRecordingInput();
        resetRecordingVisual(side);
        clearRecordingConflict();
        if (elapsed < 1000 && !reachedLimit) {
          setStatus('warning', '说话时间太短，请重试');
          showToast('至少按住 1 秒再松开');
          window.setTimeout(() => { if (!state.busy && !state.recordingSide) setStatus('waiting', '等待说话'); }, 1800);
          return;
        }
        processSpeech(side);
      }
      function cancelRecording(side, event) {
        if (state.recordingSide !== side || !inputOwnsRecording(event)) return;
        window.clearInterval(state.timer);
        window.clearTimeout(state.maxTimer);
        state.recordingSide = null;
        clearRecordingInput();
        resetRecordingVisual(side);
        clearRecordingConflict();
        setStatus('warning', '录音已取消，请重试');
        showToast(isChineseSide(side) ? '录音已取消，请重新按住说话' : 'Recording canceled, please hold to try again');
        window.setTimeout(() => {
          if (!state.busy && !state.recordingSide) setStatus('waiting', '等待说话');
        }, 1800);
      }
      function createMessage(sourceSide) {
        const targetSide = targetFor(sourceSide);
        const sourceLanguage = languageFor(sourceSide);
        const targetLanguage = languageFor(targetSide);
        const sample = samples[sourceLanguage];
        const targetIsChinese = targetLanguage === 'zh-CN';
        const translatedText = targetIsChinese ? sample.translationZh : sample.translationEn;
        const visibleLanguageNames = targetIsChinese ? languageNames : englishLanguageNames;
        const now = new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit' }).format(new Date());
        const card = document.createElement('div');
        card.className = 'message-card';
        card.innerHTML = `<span class="source">${sample.source}</span><span class="translation">${translatedText}</span><span class="message-meta"><span class="message-direction"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 4 9h4m8 10 4-4h-4M5 9h13M19 15H6"/></svg><span>${visibleLanguageNames[sourceLanguage]} → ${visibleLanguageNames[targetLanguage]}</span></span><time>${now}</time></span>`;
        const message = { text: translatedText, language: targetIsChinese ? 'zh-CN' : 'en-US' };
        emptyStates[targetSide].hidden = true;
        feeds[targetSide].appendChild(card);
        feeds[targetSide].scrollTop = feeds[targetSide].scrollHeight;
        state.lastMessage = message;
        return message;
      }
      function processSpeech(side) {
        state.busy = true;
        setMicrophonesDisabled(true);
        setStatus('recognizing', '正在识别...');
        window.setTimeout(() => {
          setStatus('translating', '正在翻译...');
          window.setTimeout(() => {
            const message = createMessage(side);
            playTranslation(message, true);
          }, 850);
        }, 750);
      }
      function finishPlayback() {
        state.playbackToken += 1;
        window.clearTimeout(state.playbackTimer);
        state.busy = false;
        setMicrophonesDisabled(false);
        setStatus('waiting', '等待说话');
      }
      function playTranslation(message, fromPipeline = false) {
        window.clearTimeout(state.playbackTimer);
        window.speechSynthesis?.cancel();
        const playbackToken = ++state.playbackToken;
        state.busy = true;
        setMicrophonesDisabled(true, true);
        setStatus('playing', '正在播放翻译语音');
        state.lastMessage = message;
        if ('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window) {
          const utterance = new SpeechSynthesisUtterance(message.text);
          utterance.lang = message.language;
          utterance.rate = .94;
          utterance.onend = () => {
            if (playbackToken === state.playbackToken) finishPlayback();
          };
          utterance.onerror = () => {
            if (playbackToken !== state.playbackToken) return;
            state.busy = false;
            setMicrophonesDisabled(false);
            setStatus('error', '语音播放失败，请重试');
            showToast('语音播放失败，请重新说话');
          };
          window.speechSynthesis.speak(utterance);
        } else {
          state.playbackTimer = window.setTimeout(() => {
            if (playbackToken === state.playbackToken) finishPlayback();
          }, fromPipeline ? 1800 : 1400);
        }
      }
      function bindMic(button) {
        button.addEventListener('pointerdown', beginRecording);
        button.addEventListener('pointermove', trackSlideCancel);
        button.addEventListener('pointerup', (event) => {
          event.preventDefault();
          if (state.cancelArmed && inputOwnsRecording(event)) cancelRecording(button.dataset.side, event);
          else finishRecording(button.dataset.side, false, event);
        });
        button.addEventListener('pointercancel', (event) => cancelRecording(button.dataset.side, event));
        button.addEventListener('lostpointercapture', (event) => cancelRecording(button.dataset.side, event));
        button.addEventListener('keydown', (event) => {
          if ((event.code === 'Space' || event.code === 'Enter') && !event.repeat) beginRecording(event);
        });
        button.addEventListener('keyup', (event) => {
          if (event.code === 'Space' || event.code === 'Enter') finishRecording(button.dataset.side, false, event);
        });
      }

      micButtons.forEach(bindMic);
      entryLanguageA.addEventListener('change', updateEntryState);
      entryLanguageB.addEventListener('change', updateEntryState);
      entrySwapButton.addEventListener('click', () => {
        const language = entryLanguageA.value;
        entryLanguageA.value = entryLanguageB.value;
        entryLanguageB.value = language;
        updateEntryState();
      });
      startConversation.addEventListener('click', requestConversationStart);
      changeLanguagesButton.addEventListener('click', showLanguageEntry);
      allowPermission.addEventListener('click', () => {
        state.permission = 'granted';
        closePermissionDialog();
        if (!languageEntry.hidden) {
          entryError.textContent = '';
          showConversation();
        } else {
          showToast('麦克风已允许');
        }
      });
      denyPermission.addEventListener('click', () => {
        state.permission = 'denied';
        closePermissionDialog();
        if (!languageEntry.hidden) {
          entryError.textContent = '需要允许麦克风权限才能开始对话';
          showToast('请允许麦克风权限后再开始对话');
        } else {
          setStatus('warning', '麦克风未授权');
          showToast('请允许麦克风权限后再试');
        }
      });
      permissionOverlay.addEventListener('click', (event) => {
        if (event.target === permissionOverlay) closePermissionDialog();
      });
      swapButton.addEventListener('click', () => {
        const language = languageA.value;
        languageA.value = languageB.value;
        languageB.value = language;
        localizeParties();
        setStatus(app.dataset.status, statusTexts[0].textContent === englishStatus(statusTexts[0].textContent) ? '等待说话' : statusTexts[0].textContent);
        showToast('双方语言已交换');
      });
      languageA.addEventListener('change', () => { localizeParties(); setStatus('waiting', '等待说话'); });
      languageB.addEventListener('change', () => { localizeParties(); setStatus('waiting', '等待说话'); });
      clearButton.addEventListener('click', () => {
        window.speechSynthesis?.cancel();
        finishPlayback();
        feeds.a.replaceChildren(emptyStates.a);
        feeds.b.replaceChildren(emptyStates.b);
        emptyStates.a.hidden = false;
        emptyStates.b.hidden = false;
        state.lastMessage = null;
        showToast('双方字幕已清空');
      });
      updateEntryState();
      localizeParties();
      setStatus('waiting', '等待说话');
    })();
  </script>
</body>
</html>
